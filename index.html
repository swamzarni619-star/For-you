<!DOCTYPE html>
<html>
<head>
<title>Happy National Girlfriend Day ❤️</title>

<style>
body{
margin:0;
background:linear-gradient(#ff9a9e,#fad0c4);
text-align:center;
font-family:Arial;
overflow-x:hidden;
}

h1{
color:white;
margin-top:40px;
}

p{
color:white;
font-size:18px;
}

.gallery{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px;
padding:20px;
}

.gallery img{
width:100%;
height:200px;
object-fit:cover;
border-radius:15px;
}

.heart{
position:fixed;
color:red;
font-size:25px;
animation:fall 5s linear infinite;
}

@keyframes fall{
from{
transform:translateY(-50px);
}
to{
transform:translateY(100vh);
opacity:0;
}
}

button{
padding:12px 25px;
border:none;
border-radius:20px;
background:white;
color:#ff1493;
font-size:18px;
}
</style>

</head>

<body>

<h1>❤️ Happy National Girlfriend Day ❤️</h1>

<p>
မင်းက ငါ့အတွက် အရေးကြီးတဲ့သူတစ်ယောက်ပါအမြဲတမ်း ပျော်ရွှင်ပြီးပျော်ရွှင်ပြီးလှပနေပါစ။
   

<img src="3754db3e-a254-436d-84dc-d3f1e57ffba5.jpeg">
<img src="947e5516-42e4-486c-8246-55a5e15edc94.jpeg">
<img src="Polish_20260731_175237437.jpg">
<img src="c468bcee-5441-49c6-822b-ff4dc1e693f5.jpeg">
<img src="ခင်ဗျားကိုကျွန်တော်ချစ်တယ်.jpeg">
<img src="e4e7jpeg-279လှပနေပါစနေပါစdb8-a850-a73b2906ac4a.jpeg">
</div>

<button onclick="alert('မင်းနဲ့တွေ့ခဲ့ရတာက ငါ့ဘဝရဲ့ အလှပဆုံးအမှတ်တရတွေထဲက တစ်ခုပါ I love You (syrmagyi😁❤️')">
Click Me ❤️
</button>

<script>

setInterval(function(){

let h=document.createElement("div");
h.className="heart";
h.innerHTML="❤️";
h.style.left=Math.random()*100+"vw";

document.body.appendChild(h);

setTimeout(()=>{
h.remove();
},5000);

},300);

</script>

</body>
</html>
