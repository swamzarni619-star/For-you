<!DOCTYPE html>
<html>
<head>
<title>Happy National Girlfriend Day ❤️</title>

<style>
body{
margin:0;
background:linear-gradient(#ff9a9e,#fad0c4);
text-align:center;
font-family:Arial;
overflow-x:hidden;
}

h1{
color:white;
margin-top:40px;
}

p{
color:white;
font-size:18px;
}

.gallery{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px;
padding:20px;
}

.gallery img{
width:100%;
height:200px;
object-fit:cover;
border-radius:15px;
}

.heart{
position:fixed;
color:red;
font-size:25px;
animation:fall 5s linear infinite;
}

@keyframes fall{
from{
transform:translateY(-50px);
}
to{
transform:translateY(100vh);
opacity:0;
}
}

button{
padding:12px 25px;
border:none;
border-radius:20px;
background:white;
color:#ff1493;
font-size:18px;
}
</style>

</head>

<body>

<h1>❤️ Happy National Girlfriend Day ❤️</h1>

<p>
မင်းက ငါ့အတွက် အရေးကြီးတဲ့သူတစ်ယောက်ပါ ❤️
</p>

<div class="gallery">

<img src="1.jpg">
<img src="2.jpg">
<img src="3.jpg">
<img src="4.jpg">
<img src="5.jpg">
<img src="6.jpg">

</div>

<button onclick="alert('I Love You ❤️')">
Click Me ❤️
</button>

<script>

setInterval(function(){

let h=document.createElement("div");
h.className="heart";
h.innerHTML="❤️";
h.style.left=Math.random()*100+"vw";

document.body.appendChild(h);

setTimeout(()=>{
h.remove();
},5000);

},300);

</script>

</body>
</html>
